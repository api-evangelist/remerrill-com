surface_relationship:
  note: >-
    Two surfaces on one host, one capability. REST: POST https://www.remerrill.com/api/line-finder
    (openapi/remerrill-com-openapi.yml). A2A: POST https://www.remerrill.com/api/a2a SendMessage, whose task
    artifact is "the exact line-finder response plus a text summary" (provider's words; confirmed by
    comparing the two live responses). No MCP server, no OpenAPI published by the provider, no
    authentication on either surface. The agent is stateless: tasks are not retained after SendMessage.
