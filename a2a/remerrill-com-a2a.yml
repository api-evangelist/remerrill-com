agent_card:
  name: RE Merrill Pump Application Agent
  description: >-
    Industrial pump selection assistance from R.E. Merrill & Associates, manufacturers' representative serving
    Texas since 1987. Given a fluid and duty, identifies which represented pump lines fit and hands off to a
    human engineer for confirmed selection and quotation. Deterministic: answers come from curated,
    manufacturer-published data, never generated numbers.
  url: null
  interface_url: https://www.remerrill.com/api/a2a
  version: 1.0.0
  protocol_version: null
  interface_protocol_version: '1.0'
  preferred_transport: null
  interface_protocol_binding: JSONRPC
  provider:
    organization: R.E. Merrill & Associates, Inc.
    url: https://www.remerrill.com
  documentation_url: https://www.remerrill.com/llms.txt
  capabilities:
    streaming: false
    push_notifications: false
    extended_agent_card: false
  default_input_modes: [application/json, text/plain]
  default_output_modes: [application/json, text/plain]
  security_schemes: null
  security: null
  signatures: 1 JWS (protected header alg ES256, typ JOSE, kid remerrill-a2a-2026-08, jku https://www.remerrill.com/.well-known/jwks.json)
  skill_count: 4
  skills:
  - {id: line-finder, name: Pump line finder, tags: [pump-selection, corrosive-fluid-pumping, chemical-pumps, industrial-equipment, texas], examples: 3}
  - {id: line-finder-grundfos, name: Grundfos dosing pump coverage, tags: [dosing-pumps, metering-pumps, chemical-feed, grundfos, texas], examples: 2}
  - {id: line-finder-continental-ultrapump, name: Continental progressing cavity coverage, tags: [progressing-cavity-pumps, sludge-pumps, polymer-feed, viscous-fluids, texas], examples: 2}
  - {id: request-quote, name: Request a quote, tags: [rfq, quotation, pump-quote], examples: 1, note: 'A handoff, not an API call: every line-finder response carries an rfqUrl that prefills the human contact form.'}
  skill_invocation: >-
    One real skill (line-finder) invoked by sending the duty JSON as a data part (or as text) to SendMessage;
    the two per-line skills describe the curated coverage the same call draws on (116 Grundfos and 105
    Continental model envelopes, each verdict citing a printed catalog page) rather than separate operations;
    request-quote is a web-form handoff. The same verdict is available as plain POST /api/line-finder
    (openapi/remerrill-com-openapi.yml#findPumpLines).
