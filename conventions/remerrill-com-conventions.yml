determinism:
  stated: true
  description: >-
    "Deterministic: answers come from curated, manufacturer-published data, never generated numbers. Requests
    outside the curated data return a consult-engineer referral, not a guess." Every rationale names the
    smallest covering model, its family, the source catalog and its printed page. The agent does not interpret
    natural language.
