surface:
  operations: 2
  writes: 0
  note: >-
    One capability on two transports. POST /api/line-finder (findPumpLines) and POST /api/a2a SendMessage
    (sendA2AMessage) are both stateless queries over curated catalog tables; POST is used to carry a JSON body,
    not to create or change anything. The provider says so directly ("Synchronous, stateless"; "Tasks ... are not
    retained afterward"). The only action with consequences — a quotation — happens off-API, when a human
    submits the prefilled contact form at rfqUrl and an engineer replies.
auth:
  style: none
  description: No API key, token or OAuth on either endpoint; the agent card declares no securitySchemes; no OAuth metadata is served on the host. Every documented example runs anonymously.
  detail: authentication/remerrill-com-authentication.yml
idempotency:
  supported: null
  coverage: na
  mechanism: null
  header: null
  scope: []
  retention: null
  description: >-
    Not applicable: there is no mutating surface. Both operations are deterministic reads — the provider
    describes the verdict as coming "only from curated tables of manufacturer-published data" — so repeating a
    request yields the same answer and creates nothing. No Idempotency-Key exists and none is needed. The A2A
    task id and contextId in a SendMessage response are fresh UUIDs per call but the task is discarded
    immediately, so replaying a message has no state to collide with.
reversibility:
  status: na
  description: >-
    Not applicable: the API performs no action that could need reversing. It quotes nothing, orders nothing,
    stores nothing. The request-quote "skill" hands the duty to a human via a web form; anything that follows
    is a human commercial conversation outside the API.
  write_surfaces: []
dry_run_mode:
  status: na
  description: Every call is already consequence-free; a dry run would be the call itself.
