- https://www.remerrill.com/llms.txt
summary: >-
  R.E. Merrill's conformance profile is the agent-protocol stack around one deterministic endpoint: an A2A
  v1.0 agent card (JWS-signed, ES256, JWKS published) over a JSON-RPC 2.0 endpoint that returns A2A-shaped
  tasks and google.rpc.ErrorInfo error details, plus a plain JSON REST twin. It declares no OAuth/OIDC (the
  surface is unauthenticated), no RFC 9457 problem details, no RFC 9116 security.txt, no RFC 9727 API
  catalog and no RFC 8594 sunset signalling. Industrial pump distribution has no sector API standard to
  declare, so no domain-standard signature is asserted — that field is reward-only and is left empty
  rather than filled.
standards:
- id: a2a
  name: Agent2Agent protocol
  version: '1.0'
  conforms: true
  grade: flavored
  evidence: >-
    a2a/remerrill-com-agent-card.json — supportedInterfaces[0] {url https://www.remerrill.com/api/a2a,
    protocolBinding JSONRPC, protocolVersion "1.0"}, capabilities object, skills[] of 4. POST /api/a2a
    SendMessage returned result.task with status.state TASK_STATE_COMPLETED and a line-finder-result artifact;
    GetTask returned -32001 Task not found with a google.rpc.ErrorInfo detail (reason TASK_NOT_FOUND). Graded
    flavored by the catalog's 1.0.0 rule because protocolVersion is per-interface rather than top-level —
    see a2a/remerrill-com-a2a.yml.
- id: jws-signed-agent-card
  name: A2A agent card signature (JWS, RFC 7515) with published JWKS (RFC 7517)
  conforms: true
  evidence: >-
    signatures[0].protected decodes to {alg ES256, typ JOSE, kid remerrill-a2a-2026-08, jku
    https://www.remerrill.com/.well-known/jwks.json}; the JWKS was fetched (200) and carries one matching
    EC P-256 key. Presence and key match verified; the signature itself was not cryptographically verified by
    this pipeline.
- id: json-rpc-2.0
  conforms: true
  evidence: 'POST /api/a2a answers {"jsonrpc":"2.0", ...} with -32601 Method not found for unknown methods and -32001 for unknown tasks.'
