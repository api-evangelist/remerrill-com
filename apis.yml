aid: remerrill-com
name: R.E. Merrill & Associates, Inc.
description: >-
  R.E. Merrill & Associates, Inc. is a Texas industrial pump distributor and manufacturers' representative
  (founded in Houston in 1987 by Ron Merrill Sr., led since 2020 by Ron Merrill Jr.; based in Wimberley, TX)
  that applies, quotes and supports 13 pump lines — Vanton thermoplastic pumps (exclusive Texas representative
  for 30+ years), Grundfos dosing and multistage pumps, Continental progressing cavity pumps, DP Pumps,
  Pinnacle-Flo, Vertiflo, Simtech, TF Seals, Garbarino, GreenPumps, Pemo, Victor and Walrus — for chemical
  processing, semiconductor, water/wastewater, boiler and petrochemical service. It publishes one
  machine-callable capability: a deterministic pump line finder that takes a pumping duty (fluid, flow,
  pressure or head, service) and returns which represented lines fit, citing the manufacturer catalog page for
  the smallest covering model, then hands off to a human engineer for quotation. The capability is exposed as
  an unauthenticated REST endpoint (POST https://www.remerrill.com/api/line-finder) and as an Agent2Agent v1.0
  agent (JSON-RPC 2.0 at /api/a2a) with a JWS-signed agent card at /.well-known/agent-card.json, a published
  JWKS, and an llms.txt as its developer documentation. No pricing is returned by the API; quotes come from an
  engineer.
