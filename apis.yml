- aid: remerrill-com:pump-application-a2a-agent
  name: RE Merrill Pump Application Agent (A2A)
  description: >-
    Agent2Agent protocol surface: a JWS-signed (ES256, JWKS at /.well-known/jwks.json) A2A v1.0 agent card at
    https://www.remerrill.com/.well-known/agent-card.json declaring four skills — the pump line finder, Grundfos
    dosing coverage, Continental progressing cavity coverage, and a request-quote handoff — served by a JSON-RPC
    2.0 endpoint at https://www.remerrill.com/api/a2a (method SendMessage; duty JSON as a data part; header
    A2A-Version: 1.0). Synchronous and stateless: a resolvable duty returns a completed task whose
    line-finder-result artifact is exactly the REST response plus a text summary; tasks are not retained
    (GetTask answers -32001 Task not found); no streaming, no push notifications, no authentication. Graded
    flavored against the catalog's A2A 1.0.0 rule because protocolVersion is declared per interface rather than
    at the top level.
  humanURL: https://www.remerrill.com/llms.txt
  baseURL: https://www.remerrill.com/api/a2a
  tags:
  - A2A
  - Agents
