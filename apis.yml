apis:
- aid: remerrill-com:pump-line-finder-api
  name: R.E. Merrill Pump Line Finder API
  description: >-
    Deterministic pump line selection over plain HTTP: POST a duty ({fluid (required), concentrationPct?,
    temperatureF?, flowGpm? or flowGph?, pressurePsi? or headFt?, service? (transfer|feed|sump|slurry|boiler)})
    to /api/line-finder and receive which represented pump lines fit and why — per-family matching-model
    counts, a rationale naming the smallest covering model with its source catalog and printed page, the items
    the endpoint deliberately leaves to a human engineer (fluid compatibility, concentration, temperature,
    service fit), the curated-vs-consult-REM coverage of the 13 lines, and an rfqUrl prefilling the quote form.
    Curated coverage is Grundfos dosing (116 model envelopes) and Continental progressing cavity (105); other
    lines return consult-REM. Unauthenticated, stateless, no rate limits documented. The provider publishes no
    OpenAPI; the one under openapi/ was generated by API Evangelist from the provider's llms.txt, agent card
    and live responses (2 operations).
  humanURL: https://www.remerrill.com/llms.txt
  baseURL: https://www.remerrill.com/api
