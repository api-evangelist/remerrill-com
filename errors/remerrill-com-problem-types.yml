problem_types:
- status: 400
  title: Invalid request
  source_operations: [findPumpLines]
  causes:
  - fluid missing or not a string (it is the only required field)
  - a numeric field (flowGpm, flowGph, pressurePsi, headFt, concentrationPct, temperatureF) that is not a number
  - service outside the published enum (transfer | feed | sump | slurry | boiler)
  remediation: >-
    Fix the named fields; the reason string lists each one as "<field>: Invalid input". Send exactly one of
    flowGpm/flowGph and exactly one of pressurePsi/headFt. Nothing is stored, so a retry is free.
- status: 405
  title: Method not allowed
  source_operations: [findPumpLines, sendA2AMessage]
  causes:
  - GET/HEAD on /api/line-finder (Allow is OPTIONS, POST) or GET on /api/a2a
  remediation: POST a JSON body. The A2A 405 body carries the agent card URL; start discovery there.
jsonrpc_errors:
  surface: POST https://www.remerrill.com/api/a2a
  http_status: 200
  errors:
  - code: -32001
    message: Task not found
    a2a_error: TaskNotFoundError
    data: 'google.rpc.ErrorInfo {reason TASK_NOT_FOUND, domain remerrill.com, metadata {taskId, note}}'
    cause: GetTask for any id — tasks complete synchronously inside SendMessage and are not retained.
    remediation: Do not poll. Read the task from the SendMessage response.
  - code: -32601
    message: Method not found
    cause: Any method other than the implemented A2A methods (observed for tools/list).
    remediation: Use SendMessage.
soft_failures:
  note: >-
    An unresolvable duty is NOT an error. A duty outside every curated envelope, or one whose fluid/
    concentration/temperature/service cannot be decided by the tables, still returns 200 with the reasons under
    unresolved[] and the human path in rfqUrl — the provider's "consult-REM referral, not a guess". Over A2A a
    non-JSON natural-language message returns a ROLE_AGENT text message restating the expected duty schema,
    also with HTTP 200 and no JSON-RPC error.
